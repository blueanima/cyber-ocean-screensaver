name: Windows screensaver

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows-scr:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --name CyberOcean main.py
      - name: Rename to .scr
        run: Copy-Item dist/CyberOcean.exe dist/CyberOcean.scr
      - uses: actions/upload-artifact@v4
        with:
          name: CyberOcean-windows-screensaver
          path: dist/CyberOcean.scr
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CyberOcean.scr
