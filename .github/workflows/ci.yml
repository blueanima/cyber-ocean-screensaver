name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q fucan main.py
      - name: Export screensaver HTML
        run: python main.py --write-screensaver screensaver.html
      - name: Serve health
        run: |
          python main.py --no-browser --port 8765 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5 6 7 8; do
            curl -fsS http://127.0.0.1:8765/api/health && break
            sleep 0.4
          done
          curl -fsS -o /dev/null http://127.0.0.1:8765/screensaver
          curl -fsS -o /dev/null http://127.0.0.1:8765/
